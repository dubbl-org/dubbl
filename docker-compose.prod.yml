services:
  web:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Start with: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
      # (--env-file is what lets the checks below see .env.production).
      # Without DATABASE_URL, the bundled database is used with POSTGRES_PASSWORD.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-dubbl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production and start with --env-file .env.production}@postgres:5432/${POSTGRES_DB:-dubbl}}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.production and start with --env-file .env.production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production and start with --env-file .env.production}
      # Encrypts saved SMTP passwords. Generate with: openssl rand -hex 32
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?Set EMAIL_ENCRYPTION_KEY in .env.production (openssl rand -hex 32)}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_DOCUMENTS_FROM: ${RESEND_DOCUMENTS_FROM:-}

      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_APPLE_ID: ${AUTH_APPLE_ID:-}
      AUTH_APPLE_SECRET: ${AUTH_APPLE_SECRET:-}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STANDARD_PRICE_ID: ${STRIPE_STANDARD_PRICE_ID:-}
      STRIPE_STANDARD_ANNUAL_PRICE_ID: ${STRIPE_STANDARD_ANNUAL_PRICE_ID:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}
      STRIPE_PREMIUM_ANNUAL_PRICE_ID: ${STRIPE_PREMIUM_ANNUAL_PRICE_ID:-}
      STRIPE_ULTIMATE_PRICE_ID: ${STRIPE_ULTIMATE_PRICE_ID:-}
      STRIPE_ULTIMATE_ANNUAL_PRICE_ID: ${STRIPE_ULTIMATE_ANNUAL_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-openai/gpt-6-luna}
      ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-medium}

      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dubbl}
    env_file:
      - path: .env.production
        required: false

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dubbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production and start with --env-file .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-dubbl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dubbl}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
